$('tabs').addEventListener('pointermove',e=>{if(!tabDrag)return;if(!tabDrag.active){if(tabDrag.scrolling||Math.hypot(e.clientX-tabDrag.x,e.clientY-tabDrag.y)>10){clearTimeout(tabDrag.timer);tabDrag.scrolling=true;$('tabs').scrollLeft=tabDrag.left+tabDrag.x-e.clientX;suppressTabClickUntil=performance.now()+500;e.preventDefault()}return}if(Math.hypot(e.clientX-tabDrag.x,e.clientY-tabDrag.y)>5)tabDrag.moved=true;e.preventDefault();if(dragGhost)dragGhost.style.transform='translate3d('+(e.clientX-tabDrag.x)+'px,'+(e.clientY-tabDrag.y)+'px,0)';const box=$('tabs').getBoundingClientRect();if(e.clientX<box.left+30)$('tabs').scrollLeft-=12;else if(e.clientX>box.right-30)$('tabs').scrollLeft+=12;const buttons=[...$('tabs').querySelectorAll('[data-tab]')],other=buttons.find(b=>b!==tabDrag.button&&e.clientX>=b.getBoundingClientRect().left&&e.clientX<=b.getBoundingClientRect().right);if(other){const rect=other.getBoundingClientRect();animateTabOrder(()=>$('tabs').insertBefore(tabDrag.button,e.clientX<rect.left+rect.width/2?other:other.nextSibling))}});
function finishTabDrag(){if(!tabDrag)return;clearTimeout(tabDrag.timer);if(tabDrag.active){navigation[view]=[...$('tabs').querySelectorAll('[data-tab]')].map(b=>b.dataset.tab);tabDrag.button.classList.remove('dragging');const id=tabDrag.button.dataset.tab,moved=tabDrag.moved;try{$('tabs').releasePointerCapture(tabDrag.pointer)}catch(e){}if(dragGhost){const ghost=dragGhost,rect=tabDrag.button.getBoundingClientRect(),old=ghost.getBoundingClientRect();ghost.animate([{transform:ghost.style.transform},{transform:'translate3d('+(rect.left-parseFloat(ghost.style.left))+'px,'+(rect.top-parseFloat(ghost.style.top))+'px,0)'}],{duration:150,easing:'ease-out'}).finished.then(()=>ghost.remove());dragGhost=null}suppressTabClickUntil=performance.now()+500;tabMarkupStamp='';stamp='';tabDrag=null;render();if(!moved&&view==='channels'&&id!=='全部')openChannelEditor(id)}else tabDrag=null}
$('tabs').addEventListener('pointerup',finishTabDrag);$('tabs').addEventListener('pointercancel',finishTabDrag);

let swipeStart=null;
function swipeChannels(){return orderedTabs().map(t=>t.id)}
function ensureCurrent(){const choices=view==='frames'?swipeChannels():['全部',...channelModels().map(item=>item.id)];if(!choices.includes(current)){current=choices[0]||'';thread='';forceScroll=true;stamp='';if(typeof Phone.history==='function')Phone.history('latest')}}
function switchBySwipe(dx,dy){if(editMode||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.5||document.querySelector('dialog[open]')||$('channelMenu').classList.contains('open')||window.getSelection()?.toString())return false;const channels=[...new Set(swipeChannels())],index=channels.indexOf(current),next=index+(dx<0?1:-1);if(next<0||next>=channels.length)return false;endHold();thread='';choose(channels[next]);document.querySelector('#tabs [data-tab="'+CSS.escape(current)+'"]')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});return true}
let swipeTimer=0,swipeTarget='',swipeDirection=0,swipeActive=false,swipeSettling=false;
function resetSwipe(){clearTimeout(swipeTimer);swipeTimer=0;swipeActive=false;swipeSettling=false;swipeTarget='';swipeDirection=0;swipeStart=null;$('swipeViewport').classList.remove('swipeMoving','swipeSettling');$('feed').style.transform='';$('swipePreview').style.transform='';$('swipePreview').hidden=true;$('swipePreview').replaceChildren()}
function adjacentSwipe(dx){const channels=[...new Set(swipeChannels())],next=channels.indexOf(current)+(dx<0?1:-1);return channels[next]||''}
function prepareSwipe(dx){swipeDirection=dx<0?-1:1;swipeTarget=adjacentSwipe(dx);const preview=$('swipePreview');preview.hidden=!swipeTarget;if(swipeTarget){let data=snapshot;try{if(typeof Phone.snapshotFor==='function')data=JSON.parse(snapshotRequest(swipeTarget,view,''))}catch(e){}const rows=(data.messages||[]).filter(m=>matchesView(m,swipeTarget));const name=view==='frames'?(snapshot.tabs.find(t=>t.id===swipeTarget)?.name||swipeTarget):channelLabel(swipeTarget);preview.innerHTML=rows.map(m=>'<div class="line" style="color:'+readableColor(m.color||'#e5dfd5')+'">'+renderMessage(m)+'</div>').join('')+(rows.length?'':'<div class="empty">这里还没有消息</div>')}$('swipeViewport').classList.add('swipeMoving');preview.scrollTop=Math.max(0,preview.scrollHeight-preview.clientHeight)}
function dragSwipe(dx){if(!swipeActive)return;const direction=dx<0?-1:1;if(direction!==swipeDirection)prepareSwipe(dx);const width=$('swipeViewport').clientWidth,offset=swipeTarget?Math.max(-width,Math.min(width,dx)):dx*.22;$('feed').style.transform='translate3d('+offset+'px,0,0)';$('swipePreview').style.transform='translate3d('+(offset-swipeDirection*width)+'px,0,0)'}
function settleSwipe(commit){if(!swipeActive){resetSwipe();return}swipeSettling=true;$('swipeViewport').classList.add('swipeSettling');const target=commit?swipeTarget:'',width=$('swipeViewport').clientWidth;$('feed').style.transform='translate3d('+(target?swipeDirection*width:0)+'px,0,0)';$('swipePreview').style.transform='translate3d('+(target?0:-swipeDirection*width)+'px,0,0)';swipeTimer=setTimeout(()=>{if(target){const previewTop=$('swipePreview').scrollTop;swipeActive=false;swipeSettling=false;thread='';choose(target);forceScroll=false;$('feed').scrollTop=previewTop;document.querySelector('#tabs [data-tab="'+CSS.escape(current)+'"]')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'})}resetSwipe()},250)}
$('feed').addEventListener('touchstart',e=>{if(editMode||swipeSettling||document.querySelector('dialog[open]')||$('channelMenu').classList.contains('open'))return;resetSwipe();swipeStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,axis:'',time:performance.now()}:null},{passive:true});
$('feed').addEventListener('touchmove',e=>{if(!swipeStart||swipeSettling)return;if(e.touches.length!==1){resetSwipe();return}const dx=e.touches[0].clientX-swipeStart.x,dy=e.touches[0].clientY-swipeStart.y;if(!swipeStart.axis&&Math.max(Math.abs(dx),Math.abs(dy))>12)swipeStart.axis=Math.abs(dx)>Math.abs(dy)*1.5?'x':'y';if(swipeStart.axis!=='x'||window.getSelection()?.toString())return;endHold();if(!prefs.smooth)return;e.preventDefault();if(!swipeActive){swipeActive=true;prepareSwipe(dx)}dragSwipe(dx)},{passive:false});
$('feed').addEventListener('touchend',e=>{if(!swipeStart||swipeSettling||!e.changedTouches.length)return;const start=swipeStart,dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;swipeStart=null;if(!swipeActive){if(start.axis!=='y')switchBySwipe(dx,dy);return}const fast=Math.abs(dx)>35&&Math.abs(dx)/Math.max(1,performance.now()-start.time)>.5;settleSwipe(!!swipeTarget&&Math.abs(dx)>Math.abs(dy)*1.5&&(Math.abs(dx)>Math.min(95,$('swipeViewport').clientWidth*.22)||fast))},{passive:true});
$('feed').addEventListener('touchcancel',()=>{if(swipeActive&&!swipeSettling)settleSwipe(false);else if(!swipeSettling)resetSwipe()},{passive:true});

initializeAllMenu();initializeNavigation();initializeAppearance();$('appearanceDialog').querySelector('.dialogTop').after($('pair'));$('pair').style.cssText='display:block;max-height:none;border:0;padding:0 0 12px';tick();

</script></body></html>
