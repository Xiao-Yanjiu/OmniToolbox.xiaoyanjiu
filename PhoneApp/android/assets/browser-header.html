<!doctype html><html style="background:transparent!important"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>__APP_STYLE__</style><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="theme-game.css"></head><body style="background:transparent!important" data-theme="__THEME__"><div id="app"><header><div class="top"><button id="pageMenuButton" onclick="Header.action('menu')" aria-label="页面导航"><span aria-hidden="true">☰</span> <strong id="pageTitle"></strong></button><span id="status" class="status"></span><button onclick="Header.action('back')">返回</button><button onclick="Header.action('refresh')">刷新</button><button id="browserExtra" onclick="Header.action('extra')"></button></div></header><div id="pageStack"><section class="appPage" style="display:flex;flex-direction:column;padding:0;overflow:hidden"><small id="browserHint" hidden onclick="Header.action('hint')" style="flex:none;font-size:10px;line-height:1.5;color:var(--muted);padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></small><div id="browserContent" style="flex:1;min-height:0;min-width:0"></div></section></div></div><script>
document.getElementById('pageTitle').textContent=__TITLE_JSON__;document.getElementById('browserExtra').textContent=__EXTRA_JSON__;
function reportContent(){const r=document.getElementById('browserContent').getBoundingClientRect(),s=getComputedStyle(document.getElementById('app'));Header.content(r.x,r.y,r.width,r.height,innerWidth,Math.max(0,parseFloat(s.borderBottomLeftRadius)-parseFloat(s.borderLeftWidth)||0));}
function syncHeader(){document.getElementById('status').textContent=Header.state();const hint=document.getElementById('browserHint'),value=Header.hint();if(hint.textContent!==value)hint.textContent=value;hint.hidden=!value;reportContent();}syncHeader();setInterval(syncHeader,500);new ResizeObserver(reportContent).observe(document.getElementById('browserContent'));window.addEventListener('resize',reportContent);
</script></body></html>
